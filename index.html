<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDA I · Devolución oral</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fa;
  color:#1f2937
}
.top{
  background:#17365d;
  color:white;
  padding:18px 24px;
  font-size:22px;
  font-weight:700
}
.wrap{
  max-width:850px;
  margin:32px auto;
  padding:0 18px
}
.card{
  background:white;
  border:1px solid #d8dee8;
  border-radius:14px;
  padding:24px;
  box-shadow:0 4px 18px rgba(0,0,0,.05)
}
.student{
  background:#eef2f7;
  padding:14px;
  border-radius:10px;
  margin:15px 0;
  line-height:1.5
}
.muted{color:#64748b}
.status{
  margin:18px 0;
  padding:12px;
  border-radius:9px;
  background:#eef2f7;
  font-weight:700
}
.status.on{
  background:#fee2e2;
  color:#991b1b
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0
}
button{
  border:1px solid #cbd5e1;
  background:white;
  border-radius:9px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer
}
button.primary{
  background:#b42318;
  color:white;
  border-color:#b42318
}
button.send{
  background:#17365d;
  color:white;
  border-color:#17365d
}
button:disabled{
  opacity:.45;
  cursor:not-allowed
}
textarea{
  width:100%;
  box-sizing:border-box;
  min-height:220px;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font:inherit;
  line-height:1.5;
  resize:vertical
}
.detail{
  font-size:13px;
  color:#64748b;
  margin-top:10px
}
.ok{color:#166534}
.bad{color:#991b1b}
.sendArea{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #e2e8f0
}
</style>
</head>

<body>

<div class="top">TDA I · Devolución oral</div>

<div class="wrap">
<div class="card">

<h2>🎙 Capturador de voz</h2>

<div id="student" class="student"></div>

<div id="status" class="status">
Micrófono detenido
</div>

<div class="controls">

<button id="start" class="primary">
🎙 Iniciar
</button>

<button id="pause" disabled>
⏸ Pausar
</button>

<button id="finish" disabled>
⏹ Finalizar
</button>

<button id="clear">
Limpiar texto
</button>

</div>

<textarea
id="text"
placeholder="La transcripción aparecerá aquí...">
</textarea>

<div id="interim" class="detail"></div>
<div id="diag" class="detail"></div>

<div class="sendArea">

<button id="send" class="send" disabled>
✓ Enviar a la evaluación
</button>

</div>

</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const estudiante =
  params.get("estudiante") || "Prueba independiente";

const id =
  params.get("id") || "";

const comision =
  params.get("comision") || "";

const docente =
  params.get("docente") || "";

const instancia =
  params.get("instancia") || "";


// ------------------------------------
// DATOS DEL ESTUDIANTE
// ------------------------------------

let datos = "<b>" + estudiante + "</b>";

if(comision)
  datos += "<br>Comisión " + comision;

if(docente)
  datos += " · " + docente;

if(instancia)
  datos +=
  '<br><span class="muted">' +
  instancia +
  "</span>";

document.getElementById("student").innerHTML = datos;


// ------------------------------------
// RECONOCIMIENTO DE VOZ
// ------------------------------------

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let active = false;
let paused = false;

let finalText = "";

const start =
  document.getElementById("start");

const pause =
  document.getElementById("pause");

const finish =
  document.getElementById("finish");

const clear =
  document.getElementById("clear");

const send =
  document.getElementById("send");

const text =
  document.getElementById("text");

const status =
  document.getElementById("status");

const interim =
  document.getElementById("interim");

const diag =
  document.getElementById("diag");


function mensaje(texto,ok=true){

  diag.textContent = texto;

  diag.className =
    "detail " + (ok ? "ok" : "bad");

}


function actualizar(){

  if(active){

    status.textContent =
      "● Escuchando…";

    status.className =
      "status on";

  }
  else if(paused){

    status.textContent =
      "Grabación pausada";

    status.className =
      "status";

  }
  else{

    status.textContent =
      "Micrófono detenido";

    status.className =
      "status";

  }

  pause.disabled =
    !recognition;

  finish.disabled =
    !recognition;

  start.disabled =
    active || paused;

}


// ------------------------------------
// PERMISO MICRÓFONO
// ------------------------------------

async function comprobarMicrofono(){

  const stream =
    await navigator.mediaDevices
      .getUserMedia({audio:true});

  stream
    .getTracks()
    .forEach(track => track.stop());

}


// ------------------------------------
// CREAR RECONOCIMIENTO
// ------------------------------------

function crearReconocimiento(){

  if(!SpeechRecognition){

    mensaje(
      "Web Speech no está disponible. Usá Chrome actualizado.",
      false
    );

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "es-AR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;


  recognition.onstart =
  function(){

    active = true;
    paused = false;

    mensaje(
      "Micrófono autorizado ✓ · Reconocimiento iniciado ✓"
    );

    actualizar();

  };


  recognition.onresult =
  function(event){

    let textoTemporal = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const frase =
        event.results[i][0].transcript;

      if(event.results[i].isFinal){

        if(finalText)
          finalText += " ";

        finalText +=
          frase.trim();

      }
      else{

        textoTemporal +=
          frase;

      }

    }

    text.value =
      finalText;

    interim.textContent =
      textoTemporal
      ? "Escuchando: " + textoTemporal
      : "";

    send.disabled =
      !text.value.trim();

  };


  recognition.onerror =
  function(event){

    active = false;

    mensaje(
      "Error de reconocimiento: " +
      event.error,
      false
    );

    actualizar();

  };


  recognition.onend =
  function(){

    active = false;

    actualizar();

  };

}


// ------------------------------------
// INICIAR
// ------------------------------------

start.onclick =
async function(){

  try{

    await comprobarMicrofono();

    if(!recognition)
      crearReconocimiento();

    finalText =
      text.value.trim();

    paused = false;

    recognition.start();

  }
  catch(error){

    mensaje(
      error.name +
      ": " +
      error.message,
      false
    );

  }

};


// ------------------------------------
// PAUSAR / CONTINUAR
// ------------------------------------

pause.onclick =
function(){

  if(!recognition)
    return;

  if(active){

    paused = true;

    recognition.stop();

  }
  else{

    paused = false;

    recognition.start();

  }

  actualizar();

};


// ------------------------------------
// FINALIZAR
// ------------------------------------

finish.onclick =
function(){

  paused = false;

  if(
    recognition &&
    active
  )
    recognition.stop();

  finalText =
    text.value.trim();

  interim.textContent = "";

  send.disabled =
    !finalText;

  mensaje(
    "Devolución finalizada. Revisá el texto y luego envialo a la evaluación."
  );

  actualizar();

};


// ------------------------------------
// LIMPIAR
// ------------------------------------

clear.onclick =
function(){

  finalText = "";

  text.value = "";

  interim.textContent = "";

  send.disabled = true;

};


// ------------------------------------
// TEXTO EDITADO MANUALMENTE
// ------------------------------------

text.oninput =
function(){

  send.disabled =
    !text.value.trim();

};


// ------------------------------------
// ENVIAR A LA RÚBRICA
// ------------------------------------

send.onclick =
function(){

  const transcripcion =
    text.value.trim();

  if(!transcripcion)
    return;


  if(!window.opener){

    mensaje(
      "Este capturador debe abrirse desde la evaluación.",
      false
    );

    return;

  }


  window.opener.postMessage(
    {
      tipo:
        "TDAI_TRANSCRIPCION",

      id:
        id,

      texto:
        transcripcion
    },
    "*"
  );


  send.textContent =
    "✓ Enviado";

  send.disabled =
    true;


  mensaje(
    "Devolución enviada correctamente a la evaluación."
  );


  setTimeout(
    function(){
      window.close();
    },
    900
  );

};


if(SpeechRecognition){

  mensaje(
    "Web Speech disponible ✓. Listo para comenzar."
  );

}
else{

  mensaje(
    "Web Speech no está disponible.",
    false
  );

}

</script>

</body>
</html>
